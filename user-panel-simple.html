<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Page</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07060b;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(620px,100%);margin:auto;padding:18px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:23px;font-weight:800}.muted{color:#999;font-size:13px;line-height:1.5}button,.btn{border:1px solid #403548;background:#15111b;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.card{background:linear-gradient(180deg,#15111c,#0f0c14);border:1px solid #30263a;border-radius:20px;padding:18px;margin:14px 0}.hero{text-align:center}.avatar{width:78px;height:78px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:2px solid #ff4d87;background:#21182a;display:grid;place-items:center;font-size:28px}.avatar img{width:100%;height:100%;object-fit:cover}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:#aaa}.field{margin-top:13px}label{display:block;color:#aaa;font-size:13px;margin:0 0 7px}input,textarea,select{width:100%;background:#09080d;color:#fff;border:1px solid #3a3043;border-radius:12px;padding:13px;outline:none}textarea{min-height:72px;resize:vertical}.save{width:100%;margin-top:14px;border:0;background:linear-gradient(135deg,#ff3d81,#8a43ff);padding:14px}.linkbox{display:flex;gap:8px;margin-top:12px}.linkbox input{flex:1}.detect{white-space:nowrap}.status{min-height:20px;margin-top:10px;color:#aaa;font-size:13px}.platform-result{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#0b0910;border:1px solid #3a3043}.platform-result.show{display:block}.platform-name{font-weight:800;font-size:16px}.link-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #2b2432}.link-row:first-child{border-top:0}.platform-icon{width:40px;height:40px;border-radius:10px;background:#21182a;display:grid;place-items:center;flex:none;font-size:20px}.link-info{min-width:0;flex:1}.link-info strong{display:block;font-size:14px}.link-info small{display:block;color:#999;margin-top:4px;word-break:break-all}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#21182a;color:#cdbbff;font-size:11px;margin-top:5px}.remove{padding:7px 10px}.preview{display:block;width:100%;text-align:center;text-decoration:none;margin-top:12px}.preview-panel{display:none}.preview-panel.show{display:block}.preview-page{background:#08070c;border:1px solid #30263a;border-radius:20px;padding:18px;text-align:center}.pv-avatar{width:70px;height:70px;border-radius:50%;overflow:hidden;margin:0 auto 8px;border:2px solid #ff4d87;background:#21182a;display:grid;place-items:center;font-size:26px}.pv-avatar img{width:100%;height:100%;object-fit:cover}.preview-links{margin-top:14px;text-align:left}.preview-link{display:block;text-decoration:none;color:#fff;padding:13px 14px;border:1px solid #30263a;border-radius:13px;background:#121019;margin-top:9px}.open-public{display:none;margin-top:10px}.open-public.show{display:block}@media(max-width:500px){.linkbox{flex-direction:column}.detect{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">My Page</div><button id="logout" type="button">Logout</button></div>

  <div class="card hero">
    <div class="avatar" id="avatarPreview">👤</div>
    <h1 id="displayName">Loading…</h1>
    <p id="displayUsername"></p>
  </div>

  <div class="card">
    <div class="field"><label>Name</label><input id="name" placeholder="Your name"></div>
    <div class="field"><label>Bio</label><textarea id="bio" placeholder="Short bio"></textarea></div>
    <div class="field"><label>Profile photo</label><input id="avatar" type="file" accept="image/*"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 5px">Add a link</h3>
    <div class="muted">Paste a link. We only detect the platform. We do not read product name, price, image, or other product information.</div>
    <div class="linkbox">
      <input id="link" type="url" placeholder="Shopee, TikTok Shop, Lazada, Amazon, etc.">
      <button class="detect" id="detect" type="button">⚡ Detect</button>
    </div>

    <div class="platform-result" id="platformResult">
      <div class="muted">Detected platform</div>
      <div class="platform-name" id="detectedPlatform">—</div>
    </div>

    <div class="field">
      <label>Category</label>
      <select id="category"></select>
    </div>

    <div class="status" id="detectStatus"></div>
    <div id="links"></div>
  </div>

  <button class="save" id="save" type="button">Save changes</button>
  <button class="btn preview" id="togglePreview" type="button">👁 Preview my page</button>
  <a class="btn preview open-public" id="openPublic" href="#" target="_blank" rel="noopener">Open public page</a>

  <div class="card preview-panel" id="previewPanel">
    <h3 style="margin:0 0 10px">Preview</h3>
    <div class="preview-page">
      <div class="pv-avatar" id="pvAvatar">👤</div>
      <h2 id="pvName" style="margin:0 0 4px">Creator</h2>
      <p id="pvBio" style="margin:0;color:#aaa">Your bio</p>
      <div class="preview-links" id="pvLinks"></div>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://tqtmssdjfptmbvjtxien.supabase.co";
const SUPABASE_KEY="sb_publishable_IeTtQyGxZ0THrBuqPmK9cQ_10JeusoA";
const BUCKET="site-assets";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let user=null,profile=null,categories=[];
const DEFAULT_CATS=["Health & Beauty","Clothes & Fashion","Gadgets & Accessories","Campaign Tools","Foods & Groceries","Heavy Duty Tools","Motor & Vehicle Parts","Books & Learning"];
function setStatus(t){$("status").textContent=t||""}function setDetectStatus(t){$("detectStatus").textContent=t||""}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function platform(url){try{const h=new URL(url).hostname.toLowerCase();if(h.includes("shopee"))return"Shopee";if(h.includes("tiktok"))return"TikTok Shop";if(h.includes("lazada"))return"Lazada";if(h.includes("amazon"))return"Amazon";if(h.includes("shein"))return"SHEIN";if(h.includes("ebay"))return"eBay";if(h.includes("facebook")||h.includes("fb."))return"Facebook";if(h.includes("instagram"))return"Instagram";if(h.includes("youtube")||h.includes("youtu.be"))return"YouTube";return h.replace(/^www\./,"")}catch{return"Unknown"}}
function normalizeProduct(p){if(!p||!p.url)return null;return{url:p.url,name:platform(p.url),platform:platform(p.url)}}
function ensureCats(){
  const saved=Array.isArray(profile?.categories)?profile.categories:[];
  categories=DEFAULT_CATS.map((name,i)=>{const c=saved[i]||{};const products=Array.isArray(c.products)?c.products.map(normalizeProduct).filter(Boolean):[];return{name:c.name||name,thumb:c.thumb||null,products}});
  $("category").innerHTML=categories.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join("");
  renderLinks();
}
function allLinks(){const out=[];categories.forEach((c,ci)=>c.products.forEach((p,pi)=>out.push({...p,ci,pi,category:c.name})));return out}
function renderLinks(){
  const root=$("links"),items=allLinks();root.innerHTML="";
  if(!items.length){root.innerHTML='<div class="status">No links yet. Add one above.</div>';updatePreview();return}
  items.forEach(p=>{const row=document.createElement("div");row.className="link-row";row.innerHTML=`<div class="platform-icon">🔗</div><div class="link-info"><strong>${esc(p.platform||platform(p.url))}</strong><span class="badge">${esc(p.category)}</span><small>${esc(p.url)}</small></div><button class="remove" type="button">✕</button>`;row.querySelector(".remove").onclick=()=>{categories[p.ci].products.splice(p.pi,1);renderLinks()};root.appendChild(row)});
  updatePreview();
}
function updatePreview(){
  const name=$("name").value.trim()||profile?.name||"Creator",bio=$("bio").value.trim()||profile?.bio||"Your bio";
  $("pvName").textContent=name;$("pvBio").textContent=bio;
  const av=$("avatarPreview").querySelector("img");$("pvAvatar").innerHTML=av?`<img src="${esc(av.src)}" alt="">`:"👤";
  const items=allLinks();$("pvLinks").innerHTML=items.length?items.map(p=>`<a class="preview-link" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 ${esc(p.platform||platform(p.url))}<div style="color:#888;font-size:11px;margin-top:3px">${esc(p.category)}</div></a>`).join(""): '<div style="color:#777;font-size:13px;padding:12px 0">No links added yet.</div>';
}
async function requireUser(){const {data}=await sb.auth.getUser();user=data.user;if(!user){location.href="login.html";return false}return true}
async function load(){
  if(!await requireUser())return;
  const {data,error}=await sb.from("creator_profiles").select("*").eq("user_id",user.id).maybeSingle();
  if(error){setStatus(error.message);return}if(!data){setStatus("Profile not found.");return}
  profile=data;$("name").value=data.name||"";$("bio").value=data.bio||"";$("displayName").textContent=data.name||data.username||"Creator";$("displayUsername").textContent=data.username?"@"+data.username:"";
  if(data.avatar)$("avatarPreview").innerHTML=`<img src="${esc(data.avatar)}" alt="">`;
  ensureCats();updatePreview();
  if(data.username){$("openPublic").href="user.html?u="+encodeURIComponent(data.username);$("openPublic").classList.add("show")}
}
async function uploadAvatar(file){if(!file)return null;const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";const path="avatars/"+user.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||undefined,cacheControl:"31536000"});if(error)throw error;return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function detectLink(){
  const url=$("link").value.trim();if(!/^https?:\/\//i.test(url)){setDetectStatus("Paste a valid http/https link.");$("platformResult").classList.remove("show");return}
  const detected=platform(url);$("detectedPlatform").textContent=detected;$("platformResult").classList.add("show");
  const ci=Number($("category").value)||0;categories[ci].products.push({url,name:detected,platform:detected});renderLinks();$("link").value="";setDetectStatus("✓ "+detected+" detected. Link added.");
}
$("detect").onclick=detectLink;
$("link").addEventListener("paste",()=>setTimeout(()=>{if(/^https?:\/\//i.test($("link").value.trim()))detectLink()},120));
$("name").addEventListener("input",updatePreview);$("bio").addEventListener("input",updatePreview);
$("avatar").addEventListener("change",()=>{const file=$("avatar").files[0];if(!file)return;const r=new FileReader();r.onload=e=>{$("avatarPreview").innerHTML=`<img src="${esc(e.target.result)}" alt="">`;updatePreview()};r.readAsDataURL(file)});
$("togglePreview").onclick=()=>{$("previewPanel").classList.toggle("show");$("togglePreview").textContent=$("previewPanel").classList.contains("show")?"✕ Hide preview":"👁 Preview my page";updatePreview()};
$("save").onclick=async()=>{if(!user)return;$("save").disabled=true;setStatus("Saving…");try{let avatar=profile.avatar||null;if($("avatar").files[0])avatar=await uploadAvatar($("avatar").files[0]);const patch={name:$("name").value.trim(),bio:$("bio").value.trim(),avatar,categories,updated_at:new Date().toISOString()};const {data,error}=await sb.from("creator_profiles").update(patch).eq("user_id",user.id).select().single();if(error)throw error;profile=data;$("displayName").textContent=data.name||data.username||"Creator";if(data.username){$("openPublic").href="user.html?u="+encodeURIComponent(data.username);$("openPublic").classList.add("show")}setStatus("✓ Saved successfully.");updatePreview()}catch(e){setStatus(e.message||"Save failed.")}finally{$("save").disabled=false}};
$("logout").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};
load();
</script>
</body>
</html>
