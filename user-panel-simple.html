<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>My Page</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#07060b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  width:min(620px,100%);
  margin:auto;
  padding:18px 16px 50px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  font-size:23px;
  font-weight:800;
}

.muted{
  color:#999;
  font-size:13px;
}

button,.btn{
  border:1px solid #403548;
  background:#15111b;
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
  cursor:pointer;
}

.card{
  background:linear-gradient(180deg,#15111c,#0f0c14);
  border:1px solid #30263a;
  border-radius:20px;
  padding:18px;
  margin:14px 0;
}

.hero{
  text-align:center;
}

.avatar{
  width:78px;
  height:78px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 10px;
  border:2px solid #ff4d87;
  background:#21182a;
  display:grid;
  place-items:center;
  font-size:28px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero h1{
  margin:0 0 5px;
  font-size:25px;
}

.hero p{
  margin:0;
  color:#aaa;
}

.field{
  margin-top:13px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:0 0 7px;
}

input,textarea{
  width:100%;
  background:#09080d;
  color:#fff;
  border:1px solid #3a3043;
  border-radius:12px;
  padding:13px;
  outline:none;
}

textarea{
  min-height:72px;
  resize:vertical;
}

.save{
  width:100%;
  margin-top:14px;
  border:0;
  background:linear-gradient(135deg,#ff3d81,#8a43ff);
  padding:14px;
}

.linkbox{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.linkbox input{
  flex:1;
}

.detect{
  white-space:nowrap;
}

.status{
  min-height:20px;
  margin-top:10px;
  color:#aaa;
  font-size:13px;
}

.link-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-top:1px solid #2b2432;
}

.link-icon{
  width:45px;
  height:45px;
  border-radius:12px;
  background:#19131f;
  display:grid;
  place-items:center;
  flex:none;
  font-size:20px;
}

.link-info{
  min-width:0;
  flex:1;
}

.link-info strong{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.link-info small{
  display:block;
  color:#888;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.remove{
  padding:7px 10px;
}

.empty{
  color:#777;
  font-size:13px;
  margin-top:15px;
}

.preview{
  display:block;
  text-align:center;
  text-decoration:none;
  margin-top:12px;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.file{
  padding:5px 0;
}

@media(max-width:500px){

  .row2{
    grid-template-columns:1fr;
  }

  .linkbox{
    flex-direction:column;
  }

  .detect{
    width:100%;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- TOP -->
  <div class="top">
    <div class="brand">My Page</div>
    <button id="logout">Logout</button>
  </div>


  <!-- PROFILE -->
  <div class="card hero">

    <div class="avatar" id="avatarPreview">
      A
    </div>

    <h1 id="displayName">
      Loading…
    </h1>

    <p id="displayUsername"></p>

  </div>


  <!-- PROFILE SETTINGS -->
  <div class="card">

    <div class="row2">

      <div class="field">
        <label>Name</label>
        <input
          id="name"
          placeholder="Your name"
        >
      </div>

      <div class="field">
        <label>Username</label>
        <input
          id="username"
          disabled
        >
      </div>

    </div>


    <div class="field">

      <label>Bio</label>

      <textarea
        id="bio"
        placeholder="Short bio"
      ></textarea>

    </div>


    <div class="row2">

      <div class="file">

        <label>Profile photo</label>

        <input
          id="avatar"
          type="file"
          accept="image/*"
        >

      </div>


      <div class="file">

        <label>Cover photo</label>

        <input
          id="cover"
          type="file"
          accept="image/*"
        >

      </div>

    </div>

  </div>


  <!-- LINKS -->
  <div class="card">

    <h3 style="margin:0 0 5px">
      Add your links
    </h3>

    <div class="muted">
      Paste your link below. We will only detect the website/platform.
    </div>


    <div class="linkbox">

      <input
        id="link"
        type="url"
        placeholder="Paste Shopee, TikTok, Lazada, Amazon or other link"
      >

      <button
        class="detect"
        id="detect"
      >
        ⚡ Detect
      </button>

    </div>


    <div
      class="status"
      id="detectStatus"
    ></div>


    <div id="links"></div>

  </div>


  <!-- SAVE -->
  <button
    class="save"
    id="save"
  >
    Save changes
  </button>


  <!-- PUBLIC PAGE -->
  <a
    class="btn preview"
    id="preview"
    href="#"
    target="_blank"
  >
    Open my public page
  </a>


  <div
    class="status"
    id="status"
  ></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://tqtmssdjfptmbvjtxien.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IeTtQyGxZ0THrBuqPmK9cQ_10JeusoA";

const BUCKET =
"site-assets";


const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


const $ =
id => document.getElementById(id);


let user = null;
let profile = null;
let categories = [];


/*
  DEFAULT CATEGORIES

  Same structure as your existing
  creator profile system.
*/

const DEFAULT_CATS = [

  "Health & Beauty",
  "Clothes & Fashion",
  "Gadgets & Accessories",
  "Campaign Tools",
  "Foods & Groceries",
  "Heavy Duty Tools",
  "Motor & Vehicle Parts",
  "Books & Learning"

];


/*
  STATUS
*/

function setStatus(text){

  $("status").textContent =
    text || "";

}


function setDetectStatus(text){

  $("detectStatus").textContent =
    text || "";

}


/*
  ESCAPE HTML
*/

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char]));

}


/*
  PLATFORM DETECTION ONLY

  IMPORTANT:
  This does NOT open/read the product page.
  It only checks the hostname.
*/

function detectPlatform(url){

  try{

    const host =
      new URL(url)
        .hostname
        .toLowerCase()
        .replace(/^www\./,"");


    if(
      host.includes("shopee")
    ){

      return "Shopee";

    }


    if(
      host.includes("tiktok")
    ){

      return "TikTok Shop";

    }


    if(
      host.includes("lazada")
    ){

      return "Lazada";

    }


    if(
      host.includes("amazon")
    ){

      return "Amazon";

    }


    if(
      host.includes("shein")
    ){

      return "SHEIN";

    }


    if(
      host.includes("ebay")
    ){

      return "eBay";

    }


    if(
      host.includes("facebook")
    ){

      return "Facebook";

    }


    if(
      host.includes("instagram")
    ){

      return "Instagram";

    }


    if(
      host.includes("youtube")
    ){

      return "YouTube";

    }


    return "Other";

  }

  catch{

    return "Other";

  }

}


/*
  CATEGORY SETUP
*/

function ensureCategories(){

  if(
    !Array.isArray(profile?.categories) ||
    !profile.categories.length
  ){

    categories =
      DEFAULT_CATS.map(name => ({

        name:name,

        thumb:null,

        products:[]

      }));

    return;

  }


  categories =
    DEFAULT_CATS.map((defaultName,index)=>{

      const category =
        profile.categories[index] || {};


      return {

        name:
          category.name ||
          defaultName,

        thumb:
          category.thumb ||
          null,

        products:
          Array.isArray(category.products)
            ? category.products
            : []

      };

    });

}


/*
  FIND LINKS
*/

function getAllLinks(){

  const all = [];


  categories.forEach(
    (category,categoryIndex)=>{

      const products =
        Array.isArray(category.products)
          ? category.products
          : [];


      products.forEach(product=>{

        if(
          product &&
          product.url
        ){

          all.push({

            ...product,

            categoryIndex

          });

        }

      });

    }
  );


  return all;

}


/*
  RENDER LINKS
*/

function renderLinks(){

  const root =
    $("links");

  root.innerHTML = "";


  const allLinks =
    getAllLinks();


  if(!allLinks.length){

    root.innerHTML =

      '<div class="empty">' +
      'No links yet. Add your first link above.' +
      '</div>';

    return;

  }


  allLinks.forEach(item=>{

    const row =
      document.createElement("div");

    row.className =
      "link-item";


    const platform =
      item.platform ||
      detectPlatform(item.url);


    row.innerHTML =

      '<div class="link-icon">🔗</div>' +

      '<div class="link-info">' +

        '<strong>' +
          esc(platform) +
        '</strong>' +

        '<small>' +
          esc(item.url) +
        '</small>' +

      '</div>' +

      '<button ' +
        'class="remove" ' +
        'type="button">' +
        '✕' +
      '</button>';


    row
      .querySelector(".remove")
      .onclick = ()=>{

        const category =
          categories[item.categoryIndex];


        if(
          !category ||
          !Array.isArray(category.products)
        ){

          return;

        }


        category.products =
          category.products.filter(
            product =>
              product !== item &&
              product.url !== item.url
          );


        renderLinks();

      };


    root.appendChild(row);

  });

}


/*
  LOGIN CHECK
*/

async function requireUser(){

  const {data,error} =
    await sb.auth.getUser();


  if(error){

    console.error(error);

  }


  user =
    data?.user || null;


  if(!user){

    location.href =
      "login.html";

    return false;

  }


  return true;

}


/*
  LOAD PROFILE
*/

async function load(){

  if(
    !await requireUser()
  ){

    return;

  }


  const {
    data,
    error
  } =
    await sb
      .from("creator_profiles")
      .select("*")
      .eq("user_id",user.id)
      .maybeSingle();


  if(error){

    setStatus(
      error.message
    );

    return;

  }


  if(!data){

    setStatus(
      "Profile not found."
    );

    return;

  }


  profile =
    data;


  ensureCategories();


  $("username").value =
    data.username || "";


  $("name").value =
    data.name || "";


  $("bio").value =
    data.bio || "";


  $("displayName").textContent =
    data.name ||
    data.username ||
    "Creator";


  $("displayUsername").textContent =
    "@" +
    (data.username || "");


  if(data.avatar){

    $("avatarPreview").innerHTML =

      '<img src="' +
      esc(data.avatar) +
      '" alt="">';

  }


  renderLinks();


  $("preview").href =
    "user.html?u=" +
    encodeURIComponent(
      data.username || ""
    );

}


/*
  UPLOAD IMAGE
*/

async function upload(
  file,
  folder
){

  if(!file){

    return null;

  }


  const ext =
    (
      file.name
        .split(".")
        .pop() ||
      "bin"
    )
    .replace(
      /[^a-z0-9]/gi,
      ""
    )
    .toLowerCase() ||
    "bin";


  const path =
    folder +
    "/" +
    user.id +
    "/" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2) +
    "." +
    ext;


  const {
    error
  } =
    await sb
      .storage
      .from(BUCKET)
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:
            file.type || undefined,
          cacheControl:
            "31536000"
        }
      );


  if(error){

    throw error;

  }


  return sb
    .storage
    .from(BUCKET)
    .getPublicUrl(path)
    .data
    .publicUrl;

}


/*
  ADD LINK

  ONLY detects the platform.
  DOES NOT read product information.
*/

async function detectLink(){

  const input =
    $("link").value.trim();


  if(
    !/^https?:\/\//i.test(input)
  ){

    setDetectStatus(
      "Paste a valid http/https link."
    );

    return;

  }


  $("detect").disabled =
    true;


  setDetectStatus(
    "Detecting website…"
  );


  try{

    const platform =
      detectPlatform(input);


    /*
      Keep existing public-page
      structure compatible.

      name = platform only.
      No product information.
      No price.
      No thumbnail.
    */

    const item = {

      url:input,

      name:platform,

      platform:platform,

      price:"",

      thumb:null,

      category:3

    };


    /*
      Default category:
      Gadgets & Accessories

      User can later organize
      links from the public system
      if you add category editing.
    */

    const categoryIndex = 2;


    if(
      !categories[categoryIndex]
    ){

      categories[categoryIndex] = {

        name:
          DEFAULT_CATS[categoryIndex],

        thumb:null,

        products:[]

      };

    }


    if(
      !Array.isArray(
        categories[categoryIndex].products
      )
    ){

      categories[categoryIndex].products =
        [];

    }


    /*
      Prevent duplicate links.
    */

    const duplicate =
      getAllLinks()
        .some(
          existing =>
            existing.url === input
        );


    if(duplicate){

      setDetectStatus(
        "This link is already added."
      );

      return;

    }


    categories[
      categoryIndex
    ].products.push(item);


    renderLinks();


    $("link").value =
      "";


    setDetectStatus(
      "✓ " +
      platform +
      " link detected and added."
    );

  }

  catch(error){

    console.error(error);

    setDetectStatus(
      "Unable to add this link."
    );

  }

  finally{

    $("detect").disabled =
      false;

  }

}


/*
  DETECT BUTTON
*/

$("detect")
  .addEventListener(
    "click",
    detectLink
  );


/*
  AUTO DETECT WHEN USER PASTES

  No website is opened.
  It only checks the pasted URL.
*/

$("link")
  .addEventListener(
    "paste",
    ()=>{

      setTimeout(()=>{

        const value =
          $("link").value.trim();


        if(
          /^https?:\/\//i.test(value)
        ){

          detectLink();

        }

      },120);

    }
  );


/*
  SAVE
*/

$("save")
  .onclick =
  async()=>{

    if(!user){

      return;

    }


    $("save").disabled =
      true;


    setStatus(
      "Saving…"
    );


    try{

      let avatar =
        profile.avatar || null;


      let cover =
        profile.cover || null;


      /*
        Upload new avatar
      */

      if(
        $("avatar").files[0]
      ){

        avatar =
          await upload(
            $("avatar").files[0],
            "avatars"
          );

      }


      /*
        Upload new cover
      */

      if(
        $("cover").files[0]
      ){

        cover =
          await upload(
            $("cover").files[0],
            "covers"
          );

      }


      const patch = {

        name:
          $("name").value.trim(),

        bio:
          $("bio").value.trim(),

        avatar:
          avatar,

        cover:
          cover,

        categories:
          categories,

        updated_at:
          new Date().toISOString()

      };


      const {
        data,
        error
      } =
        await sb
          .from("creator_profiles")
          .update(patch)
          .eq(
            "user_id",
            user.id
          )
          .select()
          .single();


      if(error){

        throw error;

      }


      profile =
        data;


      setStatus(
        "✓ Saved successfully."
      );


      $("preview").href =
        "user.html?u=" +
        encodeURIComponent(
          data.username || ""
        );

    }

    catch(error){

      console.error(error);

      setStatus(
        error.message ||
        "Save failed."
      );

    }

    finally{

      $("save").disabled =
        false;

    }

  };


/*
  LOGOUT
*/

$("logout")
  .onclick =
  async()=>{

    await sb.auth.signOut();

    location.href =
      "login.html";

  };


/*
  START
*/

load();

</script>

</body>
</html>
