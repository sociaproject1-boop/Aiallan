<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allan — aiallan.shop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
:root{--bg:#000;--card:#1c1c1e;--accent:#ff2d55;--text:#fff;--text2:#8e8e93;--border:#38383a;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}

/* ADMIN BUTTON */
.admin-btn{position:fixed;top:12px;right:12px;background:transparent;color:var(--text2);border:none;font-size:18px;cursor:pointer;z-index:10;}

/* LOGIN MODAL */
.login-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;}
.login-modal.on{display:flex;}
.login-box{background:var(--card);padding:24px;border-radius:16px;width:85%;max-width:320px;border:1px solid var(--border);}
.login-box h2{text-align:center;margin-bottom:18px;font-size:18px;}
.login-box input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:#2c2c2e;color:var(--text);font-size:15px;margin-bottom:14px;}
.login-buttons{display:flex;gap:10px;}
.btn{flex:1;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;}
.btn-red{background:var(--accent);color:white;}
.btn-gray{background:var(--border);color:var(--text);}

/* HOMEPAGE */
.home{max-width:480px;margin:0 auto;padding:60px 20px 40px;}
.profile{text-align:center;margin-bottom:20px;}
.avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff9500);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:38px;}
.name{font-size:22px;font-weight:700;margin-bottom:6px;}
.bio{color:var(--text2);font-size:14px;margin-bottom:16px;}

/* LINKS — PATAGILID SA ILALIM NG PROFILE */
.social-row{display:flex;justify-content:center;gap:14px;margin-bottom:30px;}
.social-link{width:44px;height:44px;border-radius:12px;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:20px;border:1px solid var(--border);transition:.2s;}
.social-link:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.05);}

/* PRODUCTS — PANGUNAHING NILALAMAN */
.section-title{font-size:16px;font-weight:600;margin-bottom:14px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.product-card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);text-decoration:none;color:var(--text);transition:.2s;}
.product-card:hover{transform:translateY(-3px);border-color:var(--accent);}
.product-img{width:100%;aspect-ratio:1;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:40px;}
.product-info{padding:12px;}
.product-name{font-size:15px;font-weight:600;margin-bottom:4px;}
.product-price{font-size:16px;font-weight:700;color:var(--accent);}

/* DASHBOARD */
.dash{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;}
.dash.on{display:block;}
.dash-top{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);}
.dash-top h2{font-size:17px;}
.close{background:var(--card);color:var(--text);border:none;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer;}
.dash-content{padding:18px;max-width:500px;margin:0 auto;}
.dash-card{background:var(--card);padding:18px;border-radius:12px;border:1px solid var(--border);margin-bottom:16px;}
.dash-card h3{font-size:16px;margin-bottom:12px;}
.dash-input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:#2c2c2e;color:var(--text);font-size:15px;margin-bottom:10px;}
.dash-btn{width:100%;padding:13px;border-radius:10px;border:none;background:var(--accent);color:white;font-size:15px;font-weight:600;cursor:pointer;}
.dash-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:#2c2c2e;padding:14px;border-radius:10px;text-align:center;}
.stat-num{font-size:20px;font-weight:700;color:var(--accent);}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px;}
</style>
</head>
<body>

<!-- ADMIN BUTTON -->
<button class="admin-btn" onclick="openLogin()">⚙️</button>

<!-- LOGIN MODAL -->
<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="passInput" placeholder="Password">
    <div class="login-buttons">
      <button class="btn btn-gray" onclick="closeLogin()">Cancel</button>
      <button class="btn btn-red" onclick="checkPass()">Login</button>
    </div>
  </div>
</div>

<!-- HOMEPAGE -->
<div class="home" id="homePage">
  <div class="profile">
    <div class="avatar">👤</div>
    <h1 class="name" id="dispName">Allan</h1>
    <p class="bio" id="dispBio">Affiliate & Creator</p>
  </div>

  <!-- LINKS — PATAGILID SA ILALIM NG PROFILE -->
  <div class="social-row">
    <a href="#" class="social-link" id="linkFb"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="social-link" id="linkTt"><i class="fab fa-tiktok"></i></a>
    <a href="#" class="social-link" id="linkShop"><i class="fas fa-shopping-bag"></i></a>
    <a href="#" class="social-link" id="linkIg"><i class="fab fa-instagram"></i></a>
  </div>

  <!-- PRODUCTS — PANGUNAHING NILALAMAN -->
  <p class="section-title">Featured Products</p>
  <div class="products-grid">
    <a href="#" class="product-card">
      <div class="product-img">🔥</div>
      <div class="product-info">
        <div class="product-name">Product 1</div>
        <div class="product-price">₱0.00</div>
      </div>
    </a>
    <a href="#" class="product-card">
      <div class="product-img">⭐</div>
      <div class="product-info">
        <div class="product-name">Product 2</div>
        <div class="product-price">₱0.00</div>
      </div>
    </a>
    <a href="#" class="product-card">
      <div class="product-img">🎮</div>
      <div class="product-info">
        <div class="product-name">Product 3</div>
        <div class="product-price">₱0.00</div>
      </div>
    </a>
    <a href="#" class="product-card">
      <div class="product-img">✨</div>
      <div class="product-info">
        <div class="product-name">Product 4</div>
        <div class="product-price">₱0.00</div>
      </div>
    </a>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dashPage">
  <div class="dash-top">
    <h2>Dashboard</h2>
    <button class="close" onclick="closeDash()">Close</button>
  </div>
  <div class="dash-content">
    <div class="dash-card">
      <h3>📊 Stats</h3>
      <div class="dash-stats">
        <div class="stat"><div class="stat-num">4</div><div class="stat-label">Products</div></div>
        <div class="stat"><div class="stat-num">128</div><div class="stat-label">Clicks</div></div>
      </div>
    </div>
    <div class="dash-card">
      <h3>👤 Edit Profile</h3>
      <input type="text" class="dash-input" id="inName" placeholder="Your Name">
      <input type="text" class="dash-input" id="inBio" placeholder="Short Bio">
      <button class="dash-btn" onclick="saveProfile()">Save Profile</button>
    </div>
    <div class="dash-card">
      <h3>🔗 Social Links</h3>
      <input type="url" class="dash-input" id="inFb" placeholder="Facebook URL">
      <input type="url" class="dash-input" id="inTt" placeholder="TikTok URL">
      <input type="url" class="dash-input" id="inShop" placeholder="Shopee URL">
      <input type="url" class="dash-input" id="inIg" placeholder="Instagram URL">
      <button class="dash-btn" onclick="saveLinks()">Save Links</button>
    </div>
  </div>
</div>

<script>
const PASS = "allan123";
function openLogin(){document.getElementById('loginModal').classList.add('on');}
function closeLogin(){document.getElementById('loginModal').classList.remove('on');document.getElementById('passInput').value='';}
function checkPass(){let p=document.getElementById('passInput').value;if(p===PASS){closeLogin();document.getElementById('dashPage').classList.add('on');window.scrollTo(0,0);}else alert("❌ Wrong password!");}
function closeDash(){document.getElementById('dashPage').classList.remove('on');}
function saveProfile(){let n=document.getElementById('inName').value,b=document.getElementById('inBio').value;if(n)document.getElementById('dispName').innerText=n;if(b)document.getElementById('dispBio').innerText=b;alert('✅ Profile Saved!');}
function saveLinks(){document.getElementById('linkFb').href=document.getElementById('inFb').value||'#';document.getElementById('linkTt').href=document.getElementById('inTt').value||'#';document.getElementById('linkShop').href=document.getElementById('inShop').value||'#';document.getElementById('linkIg').href=document.getElementById('inIg').value||'#';alert('✅ Links Saved!');}
</script>

</body>
</html>
