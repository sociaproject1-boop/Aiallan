<script>
const SUPABASE_URL='https://fkxuwohktzutugvqdjnb.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreHV3b2hrdHp1dHVndnFkam5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDI3MTA3NjksImV4cCI6MjAxODI4Njc2OX0.3cAcvr-sTXvB8LqbxKl6EqJIJJxENvmHdzT8yYXvs0c';const SUPABASE_BUCKET='aiallan-public';let supabaseClient;function initSupabase(){if(!supabaseClient)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('aiallan_db_v1',1);req.onupgradeneeded=function(e){const db=e.target.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state');if(!db.objectStoreNames.contains('auth'))db.createObjectStore('auth');};req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e.target.error);});}async function idbSetAuth(key,value){try{const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(['auth'],'readwrite');const store=tx.objectStore('auth');const req=store.put(value,key);req.onsuccess=()=>resolve(true);req.onerror=e=>reject(e.target.error);});}catch(e){return false;}}async function idbGetAuth(key){try{const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(['auth'],'readonly');const store=tx.objectStore('auth');const req=store.get(key);req.onsuccess=e=>resolve(e.target.result);req.onerror=e=>reject(e.target.error);});}catch(e){return null;}}async function getCurrentAdmin(){initSupabase();const stored=await idbGetAuth('admin_session');if(stored?.user)return stored.user;const{data}=await supabaseClient.auth.getSession();return data?.session?.user||null;}async function uploadAsset(file,folder){if(!supabaseClient||!file)return null;const user=await getCurrentAdmin();if(!user)throw new Error('Admin authentication required.');const ext=file.name.split('.').pop()||'bin';const path=`${folder}/${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;try{const{error}=await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path,file,{contentType:file.type||undefined,upsert:false});if(error)throw new Error(error.message);return supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl;}catch(e){console.error('Upload failed:',e);throw e;}}async function loadSavedState(){initSupabase();const user=await getCurrentAdmin();if(!user)return;try{const{data,error}=await supabaseClient.from('site_state').select('*').eq('user_id',user.id).single();if(!error&&data){onlineState=data.state||{};populateAdminUI();}}catch(e){console.warn('Load state failed:',e);}}async function saveState(){initSupabase();const user=await getCurrentAdmin();if(!user)return;const state={...onlineState,version:3,profile:{...(onlineState?.profile||{})},social:{...(onlineState?.social||{})}};state.profile.homeHero=window.homeHeroDataUrl||state.profile.homeHero||null;state.profile.featureImage=window.homeFeatureImageDataUrl||state.profile.featureImage||null;state.profile.homeVideo=window.homeVideoDataUrl||state.profile.homeVideo||null;state.profile.homeVideoPosterDataUrl=window.homeVideoPosterDataUrl||state.profile.homeVideoPosterDataUrl||null;onlineState=state;window.appState=state;try{await supabaseClient.from('site_state').upsert({user_id:user.id,state},{onConflict:'user_id'});console.log('State saved');}catch(e){console.error('Save failed:',e);}}function populateAdminUI(){if(!onlineState?.profile)onlineState.profile={};const profile=onlineState.profile;if(profile.homeHero){window.homeHeroDataUrl=profile.homeHero;}if(profile.featureImage){window.homeFeatureImageDataUrl=profile.featureImage;}if(profile.homeVideo){window.homeVideoDataUrl=profile.homeVideo;if(profile.homeVideoPoster)window.homeVideoPosterDataUrl=profile.homeVideoPoster;}}let onlineState=null;window.appState=null;window.homeHeroDataUrl=null;window.homeFeatureImageDataUrl=null;window.homeVideoDataUrl=null;window.homeVideoPosterDataUrl=null;document.addEventListener('DOMContentLoaded',function(){initSupabase();const homeHeroUploadBtn=document.getElementById('homeHeroUploadBtn');const homeHeroUpload=document.getElementById('homeHeroUpload');const homeHeroPreview=document.getElementById('homeHeroPreview');const homeHeroUploadStatus=document.getElementById('homeHeroUploadStatus');if(homeHeroUploadBtn&&homeHeroUpload){homeHeroUploadBtn.addEventListener('click',()=>{homeHeroUpload.click();});homeHeroUpload.addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;homeHeroUploadStatus.textContent='Uploading...';try{const url=await uploadAsset(file,'hero');window.homeHeroDataUrl=url;homeHeroPreview.innerHTML=`<img src="${url}" alt="Hero">`;homeHeroUploadStatus.textContent='JPG, PNG or WebP';await saveState();}catch(err){homeHeroUploadStatus.textContent='Upload failed: '+err.message;console.error(err);}});}const featureUploadBtn=document.getElementById('featureUploadBtn');const featureUpload=document.getElementById('featureUpload');const featureImagePreview=document.getElementById('featureImagePreview');const featureUploadStatus=document.getElementById('featureUploadStatus');if(featureUploadBtn&&featureUpload){featureUploadBtn.addEventListener('click',()=>{featureUpload.click();});featureUpload.addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;featureUploadStatus.textContent='Uploading...';try{const url=await uploadAsset(file,'feature');window.homeFeatureImageDataUrl=url;featureImagePreview.innerHTML=`<img src="${url}" alt="Feature">`;featureUploadStatus.textContent='JPG, PNG or WebP';await saveState();}catch(err){featureUploadStatus.textContent='Upload failed';console.error(err);}});}const homeVideoUploadBtn=document.getElementById('homeVideoUploadBtn');const homeVideoUpload=document.getElementById('homeVideoUpload');const homeVideoPreview=document.getElementById('homeVideoPreview');const homeVideoUploadStatus=document.getElementById('homeVideoUploadStatus');const removeHomeVideoBtn=document.getElementById('removeHomeVideoBtn');if(homeVideoUploadBtn&&homeVideoUpload){homeVideoUploadBtn.addEventListener('click',()=>{homeVideoUpload.click();});homeVideoUpload.addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;homeVideoUploadStatus.textContent='Uploading...';try{const url=await uploadAsset(file,'video');window.homeVideoDataUrl=url;if(homeVideoPreview)homeVideoPreview.innerHTML=`<video style="width:100%;height:100%;object-fit:cover;" src="${url}"></video>`;if(homeVideoPreview)homeVideoPreview.hidden=false;if(removeHomeVideoBtn)removeHomeVideoBtn.style.display='block';homeVideoUploadStatus.textContent='MP4, WebM';await saveState();}catch(err){homeVideoUploadStatus.textContent='Upload failed';console.error(err);}});if(removeHomeVideoBtn){removeHomeVideoBtn.addEventListener('click',async()=>{window.homeVideoDataUrl=null;if(homeVideoPreview){homeVideoPreview.innerHTML='Homepage video';homeVideoPreview.hidden=true;}if(removeHomeVideoBtn)removeHomeVideoBtn.style.display='none';await saveState();});}}});
