<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Allan — aiallan.shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-/0vKq6hKZq3x1kFqXx+5rQm6m7nQYxYkQZp1+2w7dQ+6w9GqYcVZJwzq3u3QfVjY0yq7q8r6JmQGq5bFf6t8w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* Basic reset and theme */
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
    :root{
      --bg:#000;
      --card:#1c1c1e;
      --accent:#ff2d55;
      --text:#ffffff;
      --text2:#b7b7bb;
      --border:#2f2f31;
      --fb:#1877f2;
      --ig:#e1306c;
      --tt:#000;
      --shopee:#f4512c;
      --yt:#ff0000;
      --tw:#1da1f2;
    }
    html,body{height:100%;}
    body{
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding-bottom:80px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Admin button */
    .admin-btn{
      position:fixed;
      top:12px;
      right:12px;
      background:transparent;
      color:var(--text2);
      border:none;
      font-size:20px;
      cursor:pointer;
      z-index:120;
      padding:8px;
      border-radius:8px;
      backdrop-filter:blur(6px);
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      display:none;
      align-items:flex-start;
      justify-content:center;
      z-index:110;
      overflow-y:auto;
      padding:40px 16px;
    }
    .modal.on{display:flex;}
    .modal-box{
      background:var(--card);
      padding:22px;
      border-radius:14px;
      width:92%;
      max-width:560px;
      border:1px solid var(--border);
      margin:auto;
      color:var(--text);
      box-shadow:0 6px 30px rgba(0,0,0,0.6);
    }
    .modal-box h2{text-align:center;margin-bottom:14px;font-size:18px;}
    .modal-box h3{font-size:15px;margin:12px 0;color:var(--text2);}
    .modal-box input,.modal-box textarea,.modal-box select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#272729;
      color:var(--text);
      font-size:14px;
      margin-bottom:10px;
    }
    .modal-box textarea{min-height:80px;resize:vertical;}
    .btn{padding:10px 12px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;}
    .btn-red{background:var(--accent);color:white;}
    .btn-gray{background:#2a2a2c;color:var(--text2);border:1px solid rgba(255,255,255,0.03);}

    .btn-row{display:flex;gap:10px;margin-top:8px;}
    .btn-row .btn{flex:1;}

    /* Layout */
    .home{max-width:540px;margin:0 auto;padding:70px 16px 40px;}
    .profile{text-align:center;margin-bottom:18px;}
    .avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff9500);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;overflow:hidden;border:2px solid rgba(255,255,255,0.04);}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    .name{font-size:22px;font-weight:700;margin-bottom:6px;}
    .bio{color:var(--text2);font-size:14px;margin-bottom:14px;}

    .music-player{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px;border-radius:12px;margin-bottom:18px;border:1px solid var(--border);}
    .music-player button{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .music-player span{font-size:13px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .social-row{display:flex;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
    .social-link{width:48px;height:48px;border-radius:12px;color:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:20px;transition:transform .15s;box-shadow:0 6px 18px rgba(0,0,0,0.6);}
    .social-link.fb{background:var(--fb);}
    .social-link.ig{background:linear-gradient(45deg,var(--ig),#ff9a3c);}
    .social-link.yt{background:var(--yt);}
    .social-link.tw{background:var(--tw);}
    .social-link:hover{transform:translateY(-4px);}

    .section-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;}
    .products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:40px;}
    .product-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);text-decoration:none;color:var(--text);transition:transform .12s, box-shadow .12s;padding-bottom:6px;}
    .product-card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 10px 30px rgba(0,0,0,0.6);}
    .product-thumb{width:100%;aspect-ratio:1;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;}
    .product-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .product-info{padding:10px 12px;}
    .product-name{font-size:14px;font-weight:600;line-height:1.3;color:var(--text);}

    .hidden{display:none !important;}

    @media (max-width:480px){
      .home{padding-top:42px;}
      .products-grid{grid-template-columns:repeat(2,1fr);}
    }
  </style>
</head>
<body>
  <!-- Background music (optional: add src attribute on source or audio tag) -->
  <audio id="bgMusic" loop>
    <!-- Example: <source src="audio/song.mp3" type="audio/mpeg"> -->
    Your browser does not support the audio element.
  </audio>

  <button class="admin-btn" id="adminBtn" title="Admin">⚙️</button>

  <!-- Login Modal -->
  <div class="modal" id="loginModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box" role="document">
      <h2>🔐 Admin Login</h2>
      <input type="password" id="passInput" placeholder="Enter Password" aria-label="Admin password" />
      <div class="btn-row">
        <button class="btn btn-gray" onclick="closeLogin()" type="button">Cancel</button>
        <button class="btn btn-red" onclick="checkPass()" type="button">Login</button>
      </div>
      <p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text2);">
        <a href="#" onclick="showForgotPass();return false;" style="color:var(--accent);text-decoration:none;">Forgot Password?</a>
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal" id="forgotModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box" role="document">
      <h2>🔑 Recover Password</h2>

      <div id="forgotStep1">
        <h3>Send OTP via</h3>
        <input type="email" id="recoveryEmail" placeholder="Email Address" />
        <input type="tel" id="recoveryPhone" placeholder="Phone Number" style="margin-top:8px;" />
        <button class="btn btn-red" style="width:100%;margin-top:10px;" onclick="sendOTP()" type="button">Send OTP Code</button>
      </div>

      <div id="forgotStep2" class="hidden">
        <h3>Enter OTP Code</h3>
        <input type="text" id="otpInput" placeholder="6-digit OTP Code" maxlength="6" />
        <button class="btn btn-red" style="width:100%;margin-top:10px;" onclick="verifyOTP()" type="button">Verify OTP</button>
      </div>

      <div id="forgotStep3" class="hidden">
        <h3>Set New Password</h3>
        <input type="password" id="newPass" placeholder="New password" />
        <input type="password" id="confirmPass" placeholder="Confirm password" style="margin-top:8px;" />
        <div class="btn-row">
          <button class="btn btn-gray" onclick="closeForgot()" type="button">Cancel</button>
          <button class="btn btn-red" onclick="setNewPassword()" type="button">Set Password</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="home" id="home" role="main">
    <section class="profile" aria-labelledby="profileTitle">
      <div class="avatar" id="avatarPlaceholder">
        <img src="https://raw.githubusercontent.com/sociaproject1-boop/Aiallan/main/avatar.png" alt="Avatar" onerror="this.style.display='none';this.parentElement.textContent='A';" />
      </div>
      <div class="name" id="profileTitle">Allan</div>
      <div class="bio">Creator • Shop Owner • Music Lover</div>

      <div class="music-player" aria-hidden="false">
        <button id="playBtn" aria-label="Play or pause music"><i class="fa fa-play" aria-hidden="true"></i></button>
        <span id="musicLabel">No music loaded</span>
      </div>

      <div class="social-row" role="navigation" aria-label="Social links">
        <a class="social-link fb" href="#" title="Facebook" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a class="social-link ig" href="#" title="Instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a class="social-link yt" href="#" title="YouTube" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a class="social-link tw" href="#" title="Twitter" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      </div>
    </section>

    <section aria-labelledby="productsTitle">
      <div class="section-title" id="productsTitle">Products</div>
      <div class="products-grid" id="products">
        <a class="product-card" href="#" aria-label="Sample product 1">
          <div class="product-thumb"><img src="https://via.placeholder.com/300" alt="Product 1" /></div>
          <div class="product-info"><div class="product-name">Sample Product 1</div></div>
        </a>

        <a class="product-card" href="#" aria-label="Sample product 2">
          <div class="product-thumb"><img src="https://via.placeholder.com/300" alt="Product 2" /></div>
          <div class="product-info"><div class="product-name">Sample Product 2</div></div>
        </a>
      </div>
    </section>
  </main>

  <script>
    // DEFAULT PASSWORD (change later) - client-side only
    const DEFAULT_ADMIN_PASS = 'admin123';

    // Elements (elements exist because script is at bottom of body)
    const loginModal = document.getElementById('loginModal');
    const forgotModal = document.getElementById('forgotModal');
    const adminBtn = document.getElementById('adminBtn');
    const passInput = document.getElementById('passInput');
    const bgMusic = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    const musicLabel = document.getElementById('musicLabel');

    // Modal controls
    function openLogin(){
      if(!loginModal) return;
      loginModal.classList.add('on');
      loginModal.setAttribute('aria-hidden','false');
      if(passInput){
        passInput.value = '';
        passInput.focus();
      }
    }
    function closeLogin(){
      if(!loginModal) return;
      loginModal.classList.remove('on');
      loginModal.setAttribute('aria-hidden','true');
    }
    function showForgotPass(){
      closeLogin();
      if(!forgotModal) return;
      forgotModal.classList.add('on');
      forgotModal.setAttribute('aria-hidden','false');
      // reset steps
      const s1 = document.getElementById('forgotStep1');
      const s2 = document.getElementById('forgotStep2');
      const s3 = document.getElementById('forgotStep3');
      if(s1) s1.classList.remove('hidden');
      if(s2) s2.classList.add('hidden');
      if(s3) s3.classList.add('hidden');
    }
    function closeForgot(){
      if(!forgotModal) return;
      forgotModal.classList.remove('on');
      forgotModal.setAttribute('aria-hidden','true');
      const s1 = document.getElementById('forgotStep1');
      const s2 = document.getElementById('forgotStep2');
      const s3 = document.getElementById('forgotStep3');
      if(s1) s1.classList.remove('hidden');
      if(s2) s2.classList.add('hidden');
      if(s3) s3.classList.add('hidden');
    }

    // Attach event to admin button
    if(adminBtn){
      adminBtn.addEventListener('click', openLogin, {passive:true});
    }

    // Simple client-side password check (NOT secure)
    function checkPass(){
      if(!passInput){
        alert('Password input not found.');
        return;
      }
      const val = passInput.value || '';
      if(val === DEFAULT_ADMIN_PASS){
        alert('Login successful (client-side).');
        closeLogin();
        // TODO: show admin UI or navigate to admin page (backend required)
      } else {
        alert('Incorrect password');
      }
    }

    // OTP / Forgot password stubs
    function sendOTP(){
      const email = (document.getElementById('recoveryEmail') || {}).value || '';
      const phone = (document.getElementById('recoveryPhone') || {}).value || '';
      if(!email && !phone){
        alert('Enter email or phone to receive OTP');
        return;
      }
      alert('OTP sent (stub). Proceed to enter the code.');
      const s1 = document.getElementById('forgotStep1');
      const s2 = document.getElementById('forgotStep2');
      if(s1) s1.classList.add('hidden');
      if(s2) s2.classList.remove('hidden');
    }
    function verifyOTP(){
      const otp = (document.getElementById('otpInput') || {}).value || '';
      if(otp.length === 6){
        alert('OTP verified (stub). Set new password.');
        const s2 = document.getElementById('forgotStep2');
        const s3 = document.getElementById('forgotStep3');
        if(s2) s2.classList.add('hidden');
        if(s3) s3.classList.remove('hidden');
      } else {
        alert('Enter a 6-digit OTP');
      }
    }
    function setNewPassword(){
      const p1 = (document.getElementById('newPass') || {}).value || '';
      const p2 = (document.getElementById('confirmPass') || {}).value || '';
      if(!p1 || !p2){
        alert('Fill both fields');
        return;
      }
      if(p1 !== p2){
        alert('Passwords do not match');
        return;
      }
      // In a real app you'd call the backend. This demo does not persist changes.
      alert('Password changed locally (will not persist on reload in this demo).');
      closeForgot();
    }

    // Music controls
    function toggleMusic(){
      if(!bgMusic){
        alert('No audio element found.');
        return;
      }
      // If no source, guard and inform user
      // bgMusic.src may be empty; also check if any <source> has src
      const hasSource = !!(bgMusic.currentSrc || bgMusic.src);
      if(!hasSource){
        alert('No music source configured. To enable, add a <source src=\"path/to/file.mp3\"> inside the audio element or set bgMusic.src = \"path/to/file.mp3\";');
        return;
      }
      if(bgMusic.paused){
        bgMusic.play().catch(function(err){
          // Some browsers block autoplay; handle the promise rejection
          console.warn('Play failed:', err);
          alert('Unable to play audio automatically. Interact with the page and try again.');
        });
        if(playBtn) playBtn.innerHTML = '<i class=\"fa fa-pause\"></i>';
        if(musicLabel) musicLabel.textContent = 'Playing';
      } else {
        bgMusic.pause();
        if(playBtn) playBtn.innerHTML = '<i class=\"fa fa-play\"></i>';
        if(musicLabel) musicLabel.textContent = 'Paused';
      }
    }

    // Bind playBtn
    if(playBtn){
      playBtn.addEventListener('click', toggleMusic, {passive:true});
    }

    // Accessibility: close modals with Esc
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        closeLogin();
        closeForgot();
      }
    }, {passive:true});

    // Prevent accidental form submission
    document.addEventListener('submit', function(e){
      e.preventDefault();
    });

    // Page-ready helper (optionally you can initialize dynamic content here)
    (function init(){
      // Set initial icon for play button
      if(playBtn) playBtn.innerHTML = '<i class=\"fa fa-play\"></i>';
      if(musicLabel) musicLabel.textContent = 'No music loaded';
    })();
  </script>
</body>
</html>
