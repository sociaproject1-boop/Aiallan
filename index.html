<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Allan — aiallan.shop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --accent: #ff2d55;
    --text: #fff;
    --text2: #8e8e93;
    --border: #38383a;
    --fb: #1877f2;
    --ig: #e1306c;
    --tt: #000;
    --shopee: #f4512c;
    --yt: #ff0000;
    --tw: #1da1f2;
    --muted: #101010;
    --amazon: #ff8c00;
    --shein: #d63384;
    --lazada: #ff3b30;
    --ebay: #0064d2;
    --ttshop: #000000;
    --btn-gray: #2b2b2b;
  }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .admin-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    background: transparent;
    color: var(--text2);
    border: none;
    font-size: 18px;
    cursor: pointer;
    z-index: 20;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow-y: auto;
    padding: 20px 12px;
  }
  .modal.on { display: flex; }
  .modal-box {
    background: var(--card);
    padding: 18px;
    border-radius: 12px;
    width: 92%;
    max-width: 760px;
    border: 1px solid var(--border);
    margin: auto;
    color: var(--text);
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  /* Admin modal slightly more compact when it's admin */
  .modal-box.compact { padding: 14px; max-height: 80vh; overflow:auto; }

  .modal-box h2 { text-align: center; margin-bottom: 12px; font-size: 18px; }
  .modal-box h3 { font-size: 14px; margin: 12px 0 8px; color: var(--text2); }
  .modal-box input,
  .modal-box textarea,
  .modal-box select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #171717;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .modal-box textarea { resize: vertical; min-height: 72px; }

  .btn { padding: 10px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-red { background: var(--accent); color: white; }
  .btn-gray { background: var(--border); color: var(--text); }
  .btn-row { display:flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn { flex: 1; }

  .link-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .link-item input[type="url"], .link-item input[type="text"] { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: #171717; color: var(--text); }
  .link-item .thumb-preview { width: 56px; height: 56px; border-radius: 8px; background: #121212; display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; border:1px solid #222; }
  .link-item .thumb-preview img { width:100%; height:100%; object-fit:cover; }
  .link-item .remove-btn { width:36px; height:36px; padding:0; border-radius:8px; border:none; background:#ff4444; color:white; cursor:pointer; }
  .small-file { display:none; }
  .add-link-btn {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px dashed var(--text2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    margin-bottom: 8px;
    font-size:13px;
  }

  .category-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .category-block h4 { font-size: 14px; margin-bottom: 8px; color: var(--accent); }

  .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:8px 12px; border-radius:8px; background:var(--border); color:var(--text2); font-size:13px; cursor:pointer; }
  .tab.active { background:var(--accent); color:white; }
  .hidden { display: none !important; }

  .home { max-width:480px; margin: 0 auto; padding: 40px 16px 36px; }
  .profile { text-align:center; margin-bottom:14px; }
  .avatar { width:82px; height:82px; border-radius:50%; background: linear-gradient(135deg,var(--accent),#ff9500); margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .name { font-size:20px; font-weight:700; margin-bottom:6px; }
  .bio { color:var(--text2); font-size:13px; margin-bottom:12px; }

  /* Slim music player */
  .music-player { display:flex; align-items:center; gap:8px; background:var(--card); padding:5px 7px; border-radius:10px; margin-bottom:12px; border:1px solid var(--border); height:40px; max-height:40px; }
  .music-player button { width:32px; height:32px; border-radius:8px; border:none; background:var(--accent); color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .music-player .icon { font-size:16px; }
  .music-player span { font-size:13px; color:var(--text2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .social-row { display:flex; justify-content:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .social-link { width:46px; height:46px; border-radius:10px; color:white; display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:20px; transition:.12s; }
  .social-link.fb { background:var(--fb); }
  .social-link.ig { background:var(--ig); }
  .social-link.tt { background:var(--tt); border:1px solid #333; }
  .social-link.shopee { background:var(--shopee); }
  .social-link.yt { background:var(--yt); }
  .social-link.tw { background:var(--tw); }
  .social-link:hover { transform: scale(1.06); }

  .section-title { font-size:13px; font-weight:600; margin-bottom:12px; color:var(--text2); text-transform:uppercase; letter-spacing:0.4px; }
  .products-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .product-card { background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--border); text-decoration:none; color:var(--text); transition:.12s; cursor:pointer; display:block; }
  .product-card:hover { transform: translateY(-3px); border-color:var(--accent); }
  .product-thumb { width:100%; aspect-ratio:1; background:#171717; display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; }
  .product-thumb img { width:100%; height:100%; object-fit:cover; }
  .product-info { padding:8px; }
  .product-name { font-size:13px; font-weight:600; line-height:1.2; }

  /* Category modal custom */
  .category-modal .modal-box { max-width: 640px; width: 92%; border-radius: 12px; padding: 12px; }
  .category-modal .modal-box h2 { text-align:left; font-size:16px; margin-bottom:10px; }
  /* Category links: one clean row per product, no horizontal overflow */
  .product-list { display:grid; grid-template-columns:1fr; gap:10px; width:100%; }
  .product-card-modal {
    background:#121212;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px;
    display:grid;
    grid-template-columns:72px minmax(0,1fr) auto;
    gap:10px;
    align-items:center;
    min-height:88px;
    width:100%;
    overflow:hidden;
  }
  .product-card-modal .img {
    width:72px;
    height:72px;
    border-radius:8px;
    overflow:hidden;
    background:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text2);
    font-weight:700;
  }
  .product-card-modal .img img { width:100%; height:100%; object-fit:cover; }
  .product-card-modal .meta { min-width:0; display:flex; flex-direction:column; justify-content:center; gap:5px; }
  .product-card-modal .meta .title {
    font-size:14px;
    font-weight:700;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .product-card-modal .meta .url-label {
    font-size:11px;
    color:var(--text2);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .product-card-modal .cta { min-width:0; }
  .product-card-modal .cta button { white-space:nowrap; font-size:12px; }
  .btn-shopee { background:var(--shopee); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:700; }
  .btn-amazon { background:var(--amazon); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:700; }
  .btn-shein { background:var(--shein); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:700; }
  .btn-lazada { background:var(--lazada); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:700; }
  .btn-ttshop { background:var(--ttshop); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:700; }
  .btn-ebay { background:var(--ebay); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:700; }
  .btn-default { background:var(--btn-gray); color:var(--text); border:1px solid #2f2f2f; padding:8px 12px; border-radius:8px; }

  /* Compact admin product editor */
  .prod-row {
    display:grid;
    grid-template-columns:56px minmax(0,1fr) auto;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .prod-row .prod-thumb {
    width:56px;
    height:56px;
    border-radius:8px;
    overflow:hidden;
    background:#121212;
    border:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text2);
    flex:0 0 56px;
  }
  .prod-row .prod-thumb img { width:100%; height:100%; object-fit:cover; }
  .prod-row .prod-inputs { display:grid; grid-template-columns:minmax(0,1fr); gap:6px; min-width:0; }
  .prod-row .prod-inputs input[type="text"],
  .prod-row .prod-inputs input[type="url"] {
    width:100%;
    min-width:0;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#171717;
    color:var(--text);
    font-size:13px;
    transition:border-color .15s, box-shadow .15s;
  }
  .prod-row .prod-inputs input[type="url"].platform-shopee { border-left:4px solid var(--shopee); }
  .prod-row .prod-inputs input[type="url"].platform-amazon { border-left:4px solid var(--amazon); }
  .prod-row .prod-inputs input[type="url"].platform-shein { border-left:4px solid var(--shein); }
  .prod-row .prod-inputs input[type="url"].platform-lazada { border-left:4px solid var(--lazada); }
  .prod-row .prod-inputs input[type="url"].platform-ebay { border-left:4px solid var(--ebay); }
  .prod-row .prod-inputs input[type="url"].platform-ttshop { border-left:4px solid #777; }
  .prod-row .prod-inputs input[type="url"].platform-other { border-left:4px solid #777; }

  .thumb-actions { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .upload-thumb-btn {
    padding:7px 9px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#2b2b2b;
    color:var(--text);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .upload-thumb-btn:hover { border-color:var(--accent); }
  .upload-thumb-btn.has-thumb { border-color:#34c759; }
  .category-thumb-editor {
    display:flex;
    gap:8px;
    align-items:center;
    margin:8px 0 10px;
    padding:8px;
    border:1px dashed var(--border);
    border-radius:10px;
    background:#151515;
  }
  .category-thumb-preview {
    width:52px;
    height:52px;
    border-radius:8px;
    overflow:hidden;
    background:#101010;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text2);
    flex:0 0 52px;
  }
  .category-thumb-preview img { width:100%; height:100%; object-fit:cover; }
  .category-thumb-info { min-width:0; flex:1; }
  .category-thumb-info strong { display:block; font-size:12px; margin-bottom:2px; }
  .category-thumb-info span { display:block; font-size:11px; color:var(--text2); }

  /* Automatic platform detection badge */
  .platform-hint {
    font-size:10px;
    color:var(--text2);
    margin-top:-2px;
    min-height:12px;
  }

  /* small screens adjustments */
  @media (max-width: 520px) {
    .modal-box { padding:12px; border-radius:12px; }
    .home { padding:34px 12px 36px; }
    .product-card-modal { grid-template-columns:60px minmax(0,1fr); min-height:78px; }
    .product-card-modal .img { width:60px; height:60px; }
    .product-card-modal .cta { grid-column:2; width:100%; }
    .product-card-modal .cta button { width:100%; }
    .product-card-modal .meta .title { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .prod-row { grid-template-columns:52px minmax(0,1fr); align-items:start; }
    .prod-row .prod-thumb { width:52px; height:52px; flex-basis:52px; }
    .prod-row .thumb-actions { grid-column:1 / -1; display:grid; grid-template-columns:1fr auto; }
  }
</style>
</head>
<body>
  <!-- Background audio element (closed properly) -->
  <audio id="bgMusic" loop></audio>

  <!-- Admin button -->
  <button class="admin-btn" onclick="openLogin()" aria-label="Open admin">⚙️</button>

  <!-- Login Modal -->
  <div class="modal" id="loginModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <h2 id="loginTitle">🔐 Admin Login</h2>
      <input type="password" id="passInput" placeholder="Enter Password" autocomplete="current-password">
      <div class="btn-row">
        <button class="btn btn-gray" onclick="closeLogin()">Cancel</button>
        <button class="btn btn-red" onclick="checkPass()">Login</button>
      </div>
      <!-- Forgot Password link REMOVED per request (keep login but remove recovery) -->
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal" aria-hidden="true">
    <div class="modal-box compact" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <h2 id="adminTitle">🛠️ Admin Panel</h2>

      <div class="tabs" role="tablist" aria-label="Admin tabs">
        <span class="tab active" data-tab="profile" role="tab" aria-selected="true">👤 Profile</span>
        <span class="tab" data-tab="social" role="tab" aria-selected="false">🔗 Social</span>
        <span class="tab" data-tab="products" role="tab" aria-selected="false">🛍️ Products</span>
        <span class="tab" data-tab="music" role="tab" aria-selected="false">🎵 Music</span>
      </div>

      <div id="tab-profile" class="tab-content">
        <div class="avatar-upload" style="text-align:left;margin-bottom:10px;">
          <div class="preview" id="avatarPreview" style="width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--card);display:inline-block;vertical-align:middle;margin-right:8px;">👤</div>
          <input type="file" accept="image/*" id="avatarUpload" onchange="previewAvatar(this)" style="display:inline-block;vertical-align:middle;">
        </div>
        <input type="text" id="adminName" placeholder="Your Name">
        <input type="text" id="adminBio" placeholder="Short Bio">
        <div class="btn-row">
          <button class="btn btn-red" style="flex:1;" onclick="saveProfile()">Save Profile</button>
          <button class="btn btn-gray" style="flex:1;" onclick="exportState()">Export JSON</button>
        </div>
      </div>

      <div id="tab-social" class="tab-content hidden">
        <h3>Social Links (brand colors)</h3>
        <input type="url" id="socFb" placeholder="Facebook URL" style="border-left:4px solid var(--fb);">
        <input type="url" id="socIg" placeholder="Instagram URL" style="border-left:4px solid var(--ig);">
        <input type="url" id="socTt" placeholder="TikTok URL" style="border-left:4px solid #555;">
        <input type="url" id="socShopee" placeholder="Shopee URL" style="border-left:4px solid var(--shopee);">
        <input type="url" id="socYt" placeholder="YouTube URL" style="border-left:4px solid var(--yt);">
        <input type="url" id="socTw" placeholder="Twitter/X URL" style="border-left:4px solid var(--tw);">
        <div class="btn-row">
          <button class="btn btn-red" style="flex:1;" onclick="saveSocial()">Save Social Links</button>
          <button class="btn btn-gray" style="flex:1;" onclick="triggerImport()">Import JSON</button>
        </div>
      </div>

      <div id="tab-products" class="tab-content hidden">
        <h3 style="margin-bottom:8px;">8 Categories — Editable Products</h3>

        <div id="categoriesContainer"></div>

        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-red" style="flex:1;" onclick="saveAllProducts()">💾 Save All Categories</button>
          <button class="btn btn-gray" style="flex:1;" onclick="clearAllData()">Clear All Data</button>
        </div>
      </div>

      <div id="tab-music" class="tab-content hidden">
        <h3>Background Music</h3>
        <input type="file" accept="audio/*" id="musicUpload" onchange="previewMusic(this)">
        <p style="font-size:12px;color:var(--text2);margin-bottom:10px;">Upload MP3 / M4A file (will be saved locally)</p>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-red" style="flex:1;" onclick="playMusic()">▶️ Play</button>
          <button class="btn btn-gray" style="flex:1;" onclick="pauseMusic()">⏸️ Pause</button>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:10px;">
        <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="importStateFromFile(event)">
        <button class="btn btn-gray" style="flex:1;" onclick="closeAdminModal()">Close</button>
      </div>

    </div>
  </div>

  <!-- Category Links Modal (shows all products for a clicked category) -->
  <div class="modal category-modal" id="categoryModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="categoryTitle">
      <h2 id="categoryTitle">Category Links</h2>
      <div id="categoryLinksList" style="margin-top:8px;"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-gray" onclick="closeCategoryModal()">Close</button>
      </div>

  <!-- Main content / Home page -->
  <div class="home" id="homePage">
    <div class="profile">
      <div class="avatar" id="dispAvatar">👤</div>
      <h1 class="name" id="dispName">Allan</h1>
      <p class="bio" id="dispBio">Affiliate & Creator</p>
    </div>

    <div class="music-player hidden" id="musicPlayer">
      <button onclick="toggleMusic()" id="musicBtn" aria-label="Play/Pause"><i class="fa fa-music icon"></i></button>
      <span id="musicTitle">Background Music</span>
    </div>

    <div class="social-row">
      <a href="#" class="social-link fb" id="socLinkFb" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="social-link ig" id="socLinkIg" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-link tt" id="socLinkTt" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i></a>
      <a href="#" class="social-link shopee" id="socLinkShopee" target="_blank" rel="noopener noreferrer"><i class="fas fa-shopping-bag"></i></a>
      <a href="#" class="social-link yt" id="socLinkYt" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
      <a href="#" class="social-link tw" id="socLinkTw" target="_blank" rel="noopener noreferrer"><i class="fab fa-twitter"></i></a>
    </div>

    <p class="section-title">Shop by Category</p>
    <div class="products-grid" id="productsGrid">
      <!-- product tiles injected by JS -->
    </div>
  </div>

<script>
  // IndexedDB helper (simple)
  const DB_NAME = 'aiallan_db_v1';
  const STORE_NAME = 'state';
  const AUTH_STORE = 'auth';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function (e) {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
        if (!db.objectStoreNames.contains(AUTH_STORE)) {
          db.createObjectStore(AUTH_STORE);
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  async function idbSet(key, value) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(value, key);
        req.onsuccess = () => resolve(true);
        req.onerror = e => reject(e.target.error);
      });
    } catch (e) {
      console.warn('IDB set failed', e);
      return false;
    }
  }

  async function idbGet(key) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(key);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    } catch (e) {
      console.warn('IDB get failed', e);
      return null;
    }
  }

  async function idbSetAuth(key, value) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([AUTH_STORE], 'readwrite');
        const store = tx.objectStore(AUTH_STORE);
        const req = store.put(value, key);
        req.onsuccess = () => resolve(true);
        req.onerror = e => reject(e.target.error);
      });
    } catch (e) {
      console.warn('IDB set auth failed', e);
      return false;
    }
  }

  async function idbGetAuth(key) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([AUTH_STORE], 'readonly');
        const store = tx.objectStore(AUTH_STORE);
        const req = store.get(key);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    } catch (e) {
      console.warn('IDB get auth failed', e);
      return null;
    }
  }

  function detectProductPlatform(input) {
    if (!input) return { key:'other', label:'Other / Website' };
    const url = (input.value || '').trim();
    input.classList.remove('platform-shopee','platform-amazon','platform-shein','platform-lazada','platform-ebay','platform-ttshop','platform-other');

    let key = 'other';
    let label = 'Other / Website';
    if (/shopee\./i.test(url)) { key='shopee'; label='Shopee detected'; }
    else if (/amazon\.|amzn\./i.test(url)) { key='amazon'; label='Amazon detected'; }
    else if (/shein\./i.test(url)) { key='shein'; label='Shein detected'; }
    else if (/lazada\./i.test(url)) { key='lazada'; label='Lazada detected'; }
    else if (/ebay\./i.test(url)) { key='ebay'; label='eBay detected'; }
    else if (/tiktok(?:shop)?\.|tiktokshop/i.test(url)) { key='ttshop'; label='TikTok Shop detected'; }
    else if (/^https?:\/\//i.test(url)) { key='other'; label='Website link detected'; }
    else if (url) { key='other'; label='Paste a full https:// link'; }

    input.classList.add('platform-' + key);
    input.dataset.platform = key;

    const row = input.closest('.prod-row');
    const hint = row ? row.querySelector('.platform-hint') : null;
    if (hint) hint.textContent = url ? label : '';
    input.placeholder = key === 'other' ? 'Paste product link (auto-detects platform)' : label + ' — paste product link';
    return { key, label };
  }

  // Password hashing (SHA-256) using SubtleCrypto
  async function generateSalt(len = 16) {
    const arr = new Uint8Array(len);
    window.crypto.getRandomValues(arr);
    return Array.from(arr).map(b => ('00' + b.toString(16)).slice(-2)).join('');
  }
  async function hashPassword(password, salt) {
    const enc = new TextEncoder();
    const data = enc.encode(salt + password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function savePasswordHash(password) {
    const salt = await generateSalt();
    const hash = await hashPassword(password, salt);
    await idbSetAuth(AUTH_KEY, { salt, hash });
  }
  async function verifyPassword(password) {
    const auth = await idbGetAuth(AUTH_KEY);
    if (!auth || !auth.salt || !auth.hash) return false;
    const h = await hashPassword(password, auth.salt);
    return h === auth.hash;
  }

      } else {

      }
    }
    const ok = await verifyPassword(p);
    if (ok) { closeLogin(); openAdminModal(); switchTab('profile'); }
    else alert('❌ Wrong password!');
  }

  // Build and persist state to IndexedDB
  async function saveStateToDB() {
    try {
      const state = { profile: {}, social: {}, categories: [], music: null };
      state.profile.name = document.getElementById('adminName').value || document.getElementById('dispName').innerText || '';
      state.profile.bio = document.getElementById('adminBio').value || document.getElementById('dispBio').innerText || '';
      // avatar: if dispAvatar contains img, store its src
      const dispAvatarImg = document.querySelector('#dispAvatar img');
      state.profile.avatar = dispAvatarImg ? dispAvatarImg.src : null;
      state.social = {
        fb: document.getElementById('socFb').value || '',
        ig: document.getElementById('socIg').value || '',
        tt: document.getElementById('socTt').value || '',
        shopee: document.getElementById('socShopee').value || '',
        yt: document.getElementById('socYt').value || '',
        tw: document.getElementById('socTw').value || ''
      };

      for (let i=1;i<=8;i++){
        const nameEl = document.querySelector(`.cat-name[data-cat=\"${i}\"]`);
        const products = [];
        const rows = document.querySelectorAll(`#cat${i}Products .prod-row`);
        rows.forEach((r, idx) => {
          const name = r.querySelector('.prod-name') ? r.querySelector('.prod-name').value : '';
          const url = r.querySelector('.prod-url') ? r.querySelector('.prod-url').value : '';
          const thumb = (prodThumbs[i] && prodThumbs[i][r.dataset.index]) ? prodThumbs[i][r.dataset.index] : (r.querySelector(`#prodThumb-${i}-${r.dataset.index} img`) ? r.querySelector(`#prodThumb-${i}-${r.dataset.index} img`).src : null);
          if (name || url || thumb) products.push({ name: name || '', url: url || '', thumb: thumb || null });
        });
        const block = nameEl ? nameEl.closest('.category-block') : null;
        const catThumbPreview = document.getElementById(`catThumbPreview-${i}`);
        const thumb = (block && block.dataset.categoryThumb)
          || (catThumbPreview && catThumbPreview.querySelector('img') ? catThumbPreview.querySelector('img').src : null);
        state.categories.push({ name: nameEl ? (nameEl.value || '') : '', thumb: thumb || null, products });
      }

      try { state.music = musicDataUrl || localStorage.getItem(BG_SRC_KEY) || null; } catch(e) { state.music = null; }

      await idbSet(STATE_KEY, state);
      return true;
    } catch (e) { console.warn('saveState failed', e); return false; }
  }

        document.getElementById('socIg').value = state.social.ig || '';
        document.getElementById('socTt').value = state.social.tt || '';
        document.getElementById('socShopee').value = state.social.shopee || '';
        document.getElementById('socYt').value = state.social.yt || '';
        document.getElementById('socTw').value = state.social.tw || '';

        document.getElementById('socLinkTw').href = state.social.tw || '#';

      if (Array.isArray(state.categories)) {

          const i = idx + 1;
          const nameEl = document.querySelector(`.cat-name[data-cat=\"${i}\"]`);

          // render products in admin area

          if (container && Array.isArray(cat.products)) {

            cat.products.forEach((p, pid) => {

            // store thumbs
            prodThumbs[i] = prodThumbs[i] || {};
            cat.products.forEach((p, pid) => { if (p.thumb) prodThumbs[i][pid] = p.thumb; });
          }
          // Category thumbnail wins; otherwise use first product thumbnail as the existing fallback.
          const thumb = document.getElementById('thumb' + i);
          if (thumb && cat.thumb) {
            thumb.innerHTML = `<img src="${cat.thumb}" alt="Category thumbnail">`;
          } else if (thumb && cat.products && cat.products[0] && cat.products[0].thumb) {
            thumb.innerHTML = `<img src="${cat.products[0].thumb}" alt="Product thumbnail">`;

        try { musicDataUrl = state.music; localStorage.setItem(BG_SRC_KEY, musicDataUrl); } catch(e){}
      }
    } catch (e) { console.warn('loadState failed', e); }
  }

  // Category modal handling: clicking a product tile shows ALL links for that category as neat cards
  function getPlatformInfo(url) {
    const value = (url || '').toString();
    if (/shopee\./i.test(value)) return { cls:'btn-shopee', text:'Open on Shopee' };
    if (/amazon\.|amzn\./i.test(value)) return { cls:'btn-amazon', text:'Open on Amazon' };
    if (/shein\./i.test(value)) return { cls:'btn-shein', text:'Open on Shein' };
    if (/lazada\./i.test(value)) return { cls:'btn-lazada', text:'Open on Lazada' };
    if (/ebay\./i.test(value)) return { cls:'btn-ebay', text:'Open on eBay' };
    if (/tiktok(?:shop)?\.|tiktokshop/i.test(value)) return { cls:'btn-ttshop', text:'Open on TikTok Shop' };
    return { cls:'btn-default', text:'View Product' };
  }

  function openCategoryModal(title, products) {
    const mdl = document.getElementById('categoryModal');
    const list = document.getElementById('categoryLinksList');
    const titleEl = document.getElementById('categoryTitle');
    titleEl.textContent = title || 'Category Links';
    list.innerHTML = '';

    if (!products || products.length === 0) {
      const p = document.createElement('div');
      p.style.color = 'var(--text2)';
      p.textContent = 'No products available for this category.';
      list.appendChild(p);
    } else {
      const grid = document.createElement('div');
      grid.className = 'product-list';

      products.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'product-card-modal';

        const imgWrap = document.createElement('div');
        imgWrap.className = 'img';
        if (p.thumb) {
          const img = document.createElement('img');
          img.src = p.thumb;
          img.alt = p.name ? p.name + ' thumbnail' : 'Product thumbnail';
          imgWrap.appendChild(img);
        } else {
          const initial = (p.name && p.name.trim()) ? p.name.trim().charAt(0).toUpperCase() : '';
          imgWrap.textContent = initial || '📦';
        }

        const meta = document.createElement('div');
        meta.className = 'meta';

        const titleNode = document.createElement('div');
        titleNode.className = 'title';
        titleNode.textContent = p.name || ('Product ' + (idx + 1));

        const urlNode = document.createElement('div');
        urlNode.className = 'url-label';
        const platform = getPlatformInfo(p.url);
        urlNode.textContent = p.url ? platform.text.replace('Open on ', '') : 'No link added';

        meta.appendChild(titleNode);
        meta.appendChild(urlNode);

        const ctaWrap = document.createElement('div');
        ctaWrap.className = 'cta';
        const btn = document.createElement('button');
        btn.className = platform.cls;
        btn.textContent = platform.text;
        btn.type = 'button';
        btn.onclick = (ev) => {
          ev.stopPropagation();
          if (p.url) window.open(p.url, '_blank', 'noopener,noreferrer');
        };
        ctaWrap.appendChild(btn);

        card.appendChild(imgWrap);
        card.appendChild(meta);
        card.appendChild(ctaWrap);

        card.onclick = () => { if (p.url) window.open(p.url, '_blank', 'noopener,noreferrer'); };
        grid.appendChild(card);
      });

      list.appendChild(grid);
    }

    mdl.classList.add('on');
    mdl.setAttribute('aria-hidden','false');
  }

  function closeCategoryModal(){ const m = document.getElementById('categoryModal'); m.classList.remove('on'); m.setAttribute('aria-hidden','true'); }

  // Initialize click handlers for product tiles to open category modal
  document.addEventListener('click', (e)=>{
    const card = e.target.closest('.product-card');
    if (!card) return;
    const catIndex = parseInt(card.getAttribute('data-cat'), 10);
    if (!catIndex) return;
    // gather products from admin fields
    const rows = document.querySelectorAll(`#cat${catIndex}Products .prod-row`);
    const products = [];
    rows.forEach(r => {
      const name = r.querySelector('.prod-name') ? r.querySelector('.prod-name').value : '';
      const url = r.querySelector('.prod-url') ? r.querySelector('.prod-url').value : '';
      const thumb = (prodThumbs[catIndex] && prodThumbs[catIndex][r.dataset.index]) ? prodThumbs[catIndex][r.dataset.index] : (r.querySelector(`#prodThumb-${catIndex}-${r.dataset.index} img`) ? r.querySelector(`#prodThumb-${catIndex}-${r.dataset.index} img`).src : null);
      if (name || url || thumb) products.push({ name: name || '', url: url || '', thumb: thumb || null });
    });
    const title = document.getElementById('name' + catIndex).innerText || ('Category ' + catIndex);
    openCategoryModal(title, products);
  });

  // Initialize
  window.addEventListener('DOMContentLoaded', async () => {
    // build UI will be called inside loadStateFromDB
    await loadStateFromDB();
    switchTab('profile');

    // restore background music source from localStorage if available
    try {
      const audio = document.getElementById('bgMusic');
      const savedSrc = localStorage.getItem(BG_SRC_KEY);
      const savedStateRaw = localStorage.getItem(BG_STORAGE_KEY);
      let savedState = null;
      if (savedStateRaw) {
        try { savedState = JSON.parse(savedStateRaw); } catch(e) { savedState = null; }
      }
      if (savedSrc) {
        musicDataUrl = savedSrc;
        audio.src = musicDataUrl;
      }

      if (savedState && typeof savedState.time === 'number'){
        const setTime = ()=>{
          try{
            if (audio.duration && !isNaN(audio.duration)){
              audio.currentTime = Math.min(savedState.time, Math.max(0, audio.duration - 0.1));
            }
          }catch(e){}
        };
        if (audio.readyState > 0) setTime(); else audio.addEventListener('loadedmetadata', setTime, {once:true});
      }

      const shouldPlay = savedState ? !!savedState.playing : true;
      if (shouldPlay) {
        const p = audio.play();
        if (p && typeof p.then === 'function') {
          p.then(()=>{ isPlaying=true; updateMusicUI(); }).catch(err=>{ console.warn('Autoplay prevented', err); updateMusicUI(); });
        } else { isPlaying = true; updateMusicUI(); }
      }

      if (audio.src) { document.getElementById('musicPlayer').classList.remove('hidden'); }

      const saveNow = ()=>{
        try{
          const nowState = { time: audio.currentTime || 0, playing: !audio.paused };
          localStorage.setItem(BG_STORAGE_KEY, JSON.stringify(nowState));
        }catch(e){}
      };
      audio.addEventListener('timeupdate', function(){ try{ localStorage.setItem(BG_STORAGE_KEY, JSON.stringify({ time: audio.currentTime || 0, playing: !audio.paused })); }catch(e){} });
      audio.addEventListener('play', ()=>{ isPlaying=true; updateMusicUI(); saveNow(); });
      audio.addEventListener('pause', ()=>{ isPlaying=false; updateMusicUI(); saveNow(); });
      window.addEventListener('beforeunload', saveNow);

    } catch (e) { console.warn('bgMusic init failed', e); }

    // close modals by clicking outside
    document.querySelectorAll('.modal').forEach(modal => { modal.addEventListener('click', (ev) => { if (ev.target === modal) { modal.classList.remove('on'); modal.setAttribute('aria-hidden','true'); } }); });

  });

  // Best-effort persistence so a refresh is less likely to lose recent edits.
  window.addEventListener('beforeunload', () => {
    try { saveStateToDB(); } catch (e) { console.warn('autosave failed', e); }
  });

  // Close admin/login modals with esc
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' || e.key === 'Esc') { document.querySelectorAll('.modal.on').forEach(m=>{ m.classList.remove('on'); m.setAttribute('aria-hidden','true'); }); } });

</script>
