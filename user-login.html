<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creator Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#08070c;color:#fff;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:rgba(20,16,28,.96);border:1px solid #3a3045;border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
h1{margin:0 0 8px;font-size:28px}p{color:#aaa;margin:0 0 24px}label{display:block;font-size:13px;color:#bbb;margin:14px 0 7px}
input{width:100%;padding:14px;border-radius:13px;border:1px solid #41374c;background:#0d0b12;color:#fff;outline:none}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff3d81,#8a43ff);color:#fff;font-weight:700;font-size:15px}
.switch{margin-top:16px;text-align:center;color:#aaa;font-size:13px;cursor:pointer}.msg{min-height:20px;margin-top:14px;color:#ff9fc2;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Creator Login</h1>
  <p id="subtitle">Manage your own public profile.</p>
  <form id="form">
    <label>Email</label><input id="email" type="email" autocomplete="email" required>
    <label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6">
    <label id="usernameLabel" style="display:none">Username</label>
    <input id="username" style="display:none" autocomplete="username" pattern="[a-z0-9_-]+" placeholder="yourname">
    <button id="submit" type="submit">Sign in</button>
  </form>
  <div class="switch" id="switch">Create an account</div>
  <div class="msg" id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tqtmssdjfptmbvjtxien.supabase.co";
const SUPABASE_KEY = "sb_publishable_IeTtQyGxZ0THrBuqPmK9cQ_10JeusoA";
const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let signup=false;
const $=id=>document.getElementById(id);
function mode(){
  $('title').textContent=signup?'Create your account':'Creator Login';
  $('subtitle').textContent=signup?'Create your personal creator page.':'Manage your own public profile.';
  $('submit').textContent=signup?'Create account':'Sign in';
  $('switch').textContent=signup?'Already have an account? Sign in':'Create an account';
  $('username').style.display=signup?'block':'none';
  $('usernameLabel').style.display=signup?'block':'none';
}
$('switch').onclick=()=>{signup=!signup; $('msg').textContent=''; mode();};
$('form').onsubmit=async e=>{
  e.preventDefault(); $('msg').textContent='Please wait…';
  const email=$('email').value.trim(), password=$('password').value;
  if(signup){
    const username=$('username').value.trim().toLowerCase();
    if(!/^[a-z0-9_-]{3,30}$/.test(username)){$('msg').textContent='Username must be 3–30 characters: a-z, 0-9, _ or -.';return;}
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});
    if(error){$('msg').textContent=error.message;return;}
    if(!data.user){$('msg').textContent='Check your email to continue.';return;}
    const {error:pe}=await sb.from('creator_profiles').insert({user_id:data.user.id,username,name:username});
    if(pe && !pe.message.includes('duplicate')){$('msg').textContent=pe.message;return;}
    location.href='user-panel-simple.html';
  } else {
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){$('msg').textContent=error.message;return;}
    location.href='user-panel-simple.html';
  }
};
mode();
</script>
</body>
</html>
